<!DOCTYPE html>
<html>
<head>
    <title>Digital Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9f0ee;
            color: #263238;
            padding: 45px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fffdf8;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(35, 55, 60, 0.12);
        }

        h1 {
            text-align: center;
            color: #173f4a;
            font-size: 34px;
            margin: 0 0 35px;
            letter-spacing: 0.5px;
        }

        h2 {
            color: #246b6b;
            font-size: 22px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #34474c;
            font-size: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            max-width: 430px;
            padding: 13px 15px;
            border: 1px solid #c8d5d2;
            border-radius: 8px;
            background: #ffffff;
            color: #263238;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #3d8580;
            box-shadow: 0 0 0 3px rgba(61, 133, 128, 0.12);
        }

        .add-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #286f6b;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #1e5754;
        }

        #search {
            max-width: 500px;
            background: #f8faf9;
        }

        #bookList {
            padding: 0;
            margin-top: 10px;
        }

        #bookList li {
            list-style: none;
            background: #f4f8f6;
            border: 1px solid #d9e5e1;
            border-left: 5px solid #d28b58;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 15px;
            line-height: 2;
            color: #35474b;
            position: relative;
        }

        #bookList li b {
            color: #173f4a;
        }

        .delete-btn {
            position: absolute;
            right: 18px;
            bottom: 16px;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            background: #b85c5c;
            color: white;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #963f3f;
        }

        .section {
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e7e4;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Digital Library Management System</h1>

    <div class="section">

        <h2>Add a Book</h2>

        <label><b>Book Title</b></label>
        <input
            type="text"
            id="title"
            placeholder="Enter book title"
        >

        <br><br>

        <label><b>Author Name</b></label>
        <input
            type="text"
            id="author"
            placeholder="Enter author name"
        >

        <br><br>

        <label><b>Book ID</b></label>
        <input
            type="text"
            id="bookId"
            placeholder="Enter book ID"
        >

        <br>

        <button class="add-btn" onclick="addBook()">
            Add Book
        </button>

    </div>


    <div class="section">

        <h2>Search Books</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by title or author"
            onkeyup="searchBooks()"
        >

    </div>


    <h2>Books</h2>

    <ul id="bookList"></ul>

</div>


<script>

    let books = JSON.parse(localStorage.getItem("books")) || [];


    function displayBooks(bookArray = books) {

        let bookList = document.getElementById("bookList");

        bookList.innerHTML = "";

        bookArray.forEach(function(book) {

            let newBook = document.createElement("li");

            newBook.innerHTML =
                "<b>Book ID:</b> " + book.bookId +
                "<br>" +
                "<b>Book Title:</b> " + book.title +
                "<br>" +
                "<b>Author Name:</b> " + book.author +
                '<br><button class="delete-btn" onclick="deleteBook(\'' +
                book.bookId +
                '\')">Delete</button>';

            bookList.appendChild(newBook);
        });
    }


    function addBook() {

        let title =
            document.getElementById("title").value.trim();

        let author =
            document.getElementById("author").value.trim();

        let bookId =
            document.getElementById("bookId").value.trim();


        if (title === "" || author === "" || bookId === "") {

            alert("Please fill all the details!");

            return;
        }


        let newBook = {
            title: title,
            author: author,
            bookId: bookId
        };


        books.push(newBook);

        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );


        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("bookId").value = "";


        displayBooks();
    }


    function deleteBook(bookId) {

        books = books.filter(function(book) {

            return book.bookId !== bookId;

        });


        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );


        displayBooks();
    }


    function searchBooks() {

        let searchText =
            document
                .getElementById("search")
                .value
                .toLowerCase();


        let filteredBooks = books.filter(function(book) {

            return (
                book.title.toLowerCase().includes(searchText) ||
                book.author.toLowerCase().includes(searchText)
            );

        });


        displayBooks(filteredBooks);
    }


    displayBooks();

</script>

</body>
</html>
