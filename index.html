<!DOCTYPE html>
<html>
<head>
    <title>Digital Library Management System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9f0ee;
            color: #263238;
            padding: 45px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fffdf8;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(35, 55, 60, 0.12);
        }

        h1 {
            text-align: center;
            color: #173f4a;
            font-size: 34px;
            margin: 0 0 35px;
            letter-spacing: 0.5px;
        }

        h2 {
            color: #246b6b;
            font-size: 22px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #34474c;
            font-size: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            max-width: 500px;
            padding: 13px 15px;
            border: 1px solid #c8d5d2;
            border-radius: 8px;
            background: #ffffff;
            color: #263238;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #3d8580;
            box-shadow: 0 0 0 3px rgba(61, 133, 128, 0.12);
        }

        .add-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #286f6b;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #1e5754;
        }

        .cancel-btn {
            margin-top: 20px;
            margin-left: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #7b8587;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .cancel-btn:hover {
            background: #626b6d;
        }

        #search {
            max-width: 550px;
            background: #f8faf9;
        }

        #bookList {
            padding: 0;
            margin-top: 10px;
        }

        #bookList li {
            list-style: none;
            background: #f4f8f6;
            border: 1px solid #d9e5e1;
            border-left: 5px solid #d28b58;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 15px;
            line-height: 2;
            color: #35474b;
            position: relative;
            padding-bottom: 65px;
        }

        #bookList li b {
            color: #173f4a;
        }

        .button-area {
            position: absolute;
            right: 18px;
            bottom: 16px;
            display: flex;
            gap: 8px;
        }

        .edit-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            background: #3d8580;
            color: white;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #2d6864;
        }

        .delete-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            background: #b85c5c;
            color: white;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #963f3f;
        }

        .empty-message {
            text-align: center;
            color: #718084;
            padding: 30px 10px;
            background: #f4f8f6;
            border-radius: 10px;
            border: 1px dashed #c8d5d2;
        }

        .section {
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e7e4;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 18px;
                border-radius: 12px;
            }

            h1 {
                font-size: 27px;
                line-height: 1.3;
            }

            h2 {
                font-size: 20px;
            }

            input {
                max-width: 100%;
            }

            .add-btn,
            .cancel-btn {
                width: 100%;
                margin-left: 0;
            }

            .cancel-btn {
                margin-top: 10px;
            }

            #bookList li {
                padding-bottom: 115px;
            }

            .button-area {
                left: 20px;
                right: 20px;
                bottom: 15px;
            }

            .edit-btn,
            .delete-btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Digital Library Management System</h1>

    <div class="section">

        <h2 id="formTitle">Add a Book</h2>

        <label>
            <b>Book Title</b>
        </label>

        <input
            type="text"
            id="title"
            placeholder="Enter book title"
        >

        <br><br>

        <label>
            <b>Author Name</b>
        </label>

        <input
            type="text"
            id="author"
            placeholder="Enter author name"
        >

        <br><br>

        <label>
            <b>Book ID</b>
        </label>

        <input
            type="text"
            id="bookId"
            placeholder="Enter book ID"
        >

        <br>

        <button
            class="add-btn"
            id="submitBtn"
            onclick="saveBook()"
        >
            Add Book
        </button>

        <button
            class="cancel-btn"
            id="cancelBtn"
            onclick="cancelEdit()"
        >
            Cancel
        </button>

    </div>


    <div class="section">

        <h2>Search Books</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by title or author"
            onkeyup="searchBooks()"
        >

    </div>


    <h2>Books</h2>

    <ul id="bookList"></ul>

</div>


<script>

    let books = JSON.parse(localStorage.getItem("books")) || [];

    let editingBookId = null;


    function displayBooks(bookArray = books) {

        let bookList = document.getElementById("bookList");

        bookList.innerHTML = "";


        if (bookArray.length === 0) {

            bookList.innerHTML =
                '<li class="empty-message">No books found.</li>';

            return;
        }


        bookArray.forEach(function(book) {

            let newBook = document.createElement("li");

            newBook.innerHTML =
                "<b>Book ID:</b> " + escapeHTML(book.bookId) +
                "<br>" +
                "<b>Book Title:</b> " + escapeHTML(book.title) +
                "<br>" +
                "<b>Author Name:</b> " + escapeHTML(book.author) +

                '<div class="button-area">' +

                '<button class="edit-btn" onclick="editBook(\'' +
                escapeHTML(book.bookId) +
                '\')">Edit</button>' +

                '<button class="delete-btn" onclick="deleteBook(\'' +
                escapeHTML(book.bookId) +
                '\')">Delete</button>' +

                '</div>';


            bookList.appendChild(newBook);
        });
    }


    function saveBook() {

        let title =
            document.getElementById("title").value.trim();

        let author =
            document.getElementById("author").value.trim();

        let bookId =
            document.getElementById("bookId").value.trim();


        if (title === "" || author === "" || bookId === "") {

            alert("Please fill all the details!");

            return;
        }


        if (editingBookId === null) {

            let duplicateBook = books.some(function(book) {

                return book.bookId.toLowerCase() === bookId.toLowerCase();

            });


            if (duplicateBook) {

                alert("A book with this Book ID already exists!");

                return;
            }


            let newBook = {
                title: title,
                author: author,
                bookId: bookId
            };


            books.push(newBook);

            alert("Book added successfully!");

        } else {

            let book = books.find(function(book) {

                return book.bookId === editingBookId;

            });


            if (book) {

                book.title = title;
                book.author = author;

                alert("Book updated successfully!");
            }


            editingBookId = null;

            document.getElementById("formTitle").innerText =
                "Add a Book";

            document.getElementById("submitBtn").innerText =
                "Add Book";

            document.getElementById("cancelBtn").style.display =
                "none";
        }


        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );


        clearForm();

        displayBooks();
    }


    function editBook(bookId) {

        let book = books.find(function(book) {

            return book.bookId === bookId;

        });


        if (!book) {
            return;
        }


        document.getElementById("title").value =
            book.title;

        document.getElementById("author").value =
            book.author;

        document.getElementById("bookId").value =
            book.bookId;


        document.getElementById("bookId").disabled =
            true;


        editingBookId = bookId;


        document.getElementById("formTitle").innerText =
            "Edit Book";

        document.getElementById("submitBtn").innerText =
            "Update Book";

        document.getElementById("cancelBtn").style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    function cancelEdit() {

        editingBookId = null;

        clearForm();

        document.getElementById("bookId").disabled =
            false;

        document.getElementById("formTitle").innerText =
            "Add a Book";

        document.getElementById("submitBtn").innerText =
            "Add Book";

        document.getElementById("cancelBtn").style.display =
            "none";
    }


    function deleteBook(bookId) {

        let confirmDelete =
            confirm("Are you sure you want to delete this book?");


        if (!confirmDelete) {
            return;
        }


        books = books.filter(function(book) {

            return book.bookId !== bookId;

        });


        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );


        displayBooks();
    }


    function searchBooks() {

        let searchText =
            document
                .getElementById("search")
                .value
                .toLowerCase()
                .trim();


        let filteredBooks = books.filter(function(book) {

            return (
                book.title.toLowerCase().includes(searchText) ||
                book.author.toLowerCase().includes(searchText)
            );

        });


        displayBooks(filteredBooks);
    }


    function clearForm() {

        document.getElementById("title").value = "";

        document.getElementById("author").value = "";

        document.getElementById("bookId").value = "";

        document.getElementById("bookId").disabled = false;
    }


    function escapeHTML(text) {

        let div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    displayBooks();

</script>

</body>
</html>
